server:
  port: 8081

spring:
  application:
    name: service-tasks
  datasource:
    url: jdbc:h2:mem:testedb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  config:
    import: "configserver:http://localhost:8888/config"
  cloud:
    config:
      uri: "http://localhost:8888/config"

eureka:
  client:
    serviceUrl:
      defaultZone: "http://localhost:8888/eureka"
  instance:
    prefer-ip-address: false
    hostname: localhost