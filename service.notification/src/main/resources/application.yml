server:
  port: 8082
spring:
  main:
    banner-mode: off
  application:
    name: service-notification
  config:
    import: "configserver:http://localhost:8888/config"
  cloud:
    config:
      uri: "http://localhost:8888/config"

eureka:
  client:
    serviceUrl:
      defaultZone: "http://localhost:8888/eureka"
  instance:
    prefer-ip-address: false
    hostname: localhost