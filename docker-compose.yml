services:
  service-main:
    build:
      context: ./service.main
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http:localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - service-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  service-notification:
    build:
      context: ./service.notification
    ports:
      - "8082:8082"
    depends_on:
      service-main:
        condition: service_healthy
    networks:
      - service-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  service-tasks:
    build:
      context: ./service.one
    ports:
      - "8081:8081"
    depends_on:
      service-main:
        condition: service_healthy
      service-notification:
        condition: service_started
    networks:
      - service-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  service-network:
    driver: bridge